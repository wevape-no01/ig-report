name: 인스타 리포트 갱신

on:
  schedule:
    # 매일 한국시간 오전 7시 (UTC 22:00). GitHub 사정으로 몇십 분 늦을 수 있음.
    - cron: "0 22 * * *"
  workflow_dispatch:        # Actions 탭에서 손으로도 실행 가능

permissions:
  contents: write           # 갱신된 index.html / history.json 을 저장소에 다시 커밋

concurrency:
  group: ig-report
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 인스타 데이터 수집
        env:
          IG_ACCOUNTS: ${{ secrets.IG_ACCOUNTS }}
        run: python instagram_api.py

      - name: 대시보드 생성
        run: python build_dashboard.py

      - name: 성과 분석 페이지 생성
        run: python build_analysis.py

      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html analysis.html history.json report_data.json posts_cache.json
          if git diff --staged --quiet; then
            echo "변경사항 없음 — 커밋 생략"
          else
            git commit -m "리포트 자동 갱신 $(date -u +'%Y-%m-%d')"
            git push
          fi
