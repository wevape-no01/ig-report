(function () {

  const KIND = document.getElementById('weeks').dataset.kind;
  const PER = 5;
  let page = 0, sel = 0;

  const n = (v, u) => (v === null || v === undefined) ? '-' : v.toLocaleString() + (u || '');
  function dl(d, pct, u) {
    if (d === null || d === undefined) return '<span class="dim">비교값 없음</span>';
    if (d === 0) return '<span class="dim">지난주와 같음</span>';
    const c = d > 0 ? 'up' : 'down';
    let s = (d > 0 ? '+' : '') + d.toLocaleString() + (u || '');
    if (pct !== null && pct !== undefined) s += ' · ' + (d > 0 ? '+' : '') + pct + '%';
    return '<span class="' + c + '">' + s + '</span> <span class="dim">(전주 대비)</span>';
  }
  const md = a => a.slice(5).replace('-', '/');
  const tile = (l, v, note) =>
    `<div class="stat-tile"><div class="label">${l}</div><div class="value">${v}</div>
     <div class="note">${note}</div></div>`;

  function summary(w) {
    if (KIND === 'th') {
      const t = w.th;
      if (!t) return '기록 없음';
      return '조회 ' + n(t.views) + ' · 팔로워 ' + n(t.followers, '명');
    }
    const m = (w.ig || [])[0];
    if (!m) return '기록 없음';
    return '신규 ' + n(m.new_followers, '명') + ' · 도달 ' + n(m.reach);
  }

  function card(w) {
    let h = `<p class="period"><b>${w.start} ~ ${w.end}</b> · 그 앞 7일과 비교합니다.</p>`;
    if (KIND === 'th') {
      const t = w.th;

      h += `<section><h2>스레드</h2>
        <p class="sub">@${t.username || '?'} · 이 주에 올린 글 ${t.posted}개</p>
        <div class="kpi-row">
          ${tile('조회수', n(t.views), dl(t.views_delta, t.views_pct))}
          ${tile('주말 기준 팔로워', n(t.followers, '명'), dl(t.followers_delta, null, '명'))}
          ${tile('좋아요', n(t.likes), '전체 기간 누적')}
          ${tile('리포스트', n(t.reposts), '전체 기간 누적')}
        </div></section>`;
      return h;
    }
    (w.ig || []).forEach(m => {
      h += `<section><h2>${m.label}</h2>
        <p class="sub">@${m.user} · 이 주에 올린 게시물 ${m.posted}개</p>
        <div class="kpi-row">
          ${tile('신규 팔로워', n(m.new_followers, '명'),
                 dl(m.new_followers_delta, m.new_followers_pct, '명'))}
          ${tile('도달', n(m.reach), dl(m.reach_delta, m.reach_pct))}
          ${tile('조회수', n(m.views), dl(m.views_delta, m.views_pct))}
          ${tile('주말 기준 팔로워', n(m.followers, '명'),
                 dl(m.followers_delta, m.followers_pct, '명'))}
        </div></section>`;
    });
    return h;
  }

  function draw() {
    const s = page * PER, part = WEEKS.slice(s, s + PER);
    document.getElementById('wkList').innerHTML = part.map((w, i) => `
      <div class="wk ${s + i === sel ? 'on' : ''}" data-i="${s + i}">
        <div class="t">${w.label}</div>
        <div class="d">${md(w.start)} ~ ${md(w.end)}</div>
        <div class="s">${summary(w)}</div></div>`).join('');
    document.querySelectorAll('.wk').forEach(el => el.onclick = () => {
      sel = +el.dataset.i; draw();
    });
    const pages = Math.ceil(WEEKS.length / PER);
    let p = `<button ${page === 0 ? 'disabled' : ''} data-p="${page - 1}">‹</button>`;
    for (let i = 0; i < pages; i++)
      p += `<button data-p="${i}" aria-current="${i === page}">${i + 1}</button>`;
    p += `<button ${page >= pages - 1 ? 'disabled' : ''} data-p="${page + 1}">›</button>`;
    document.getElementById('pager').innerHTML = pages > 1 ? p : '';
    document.querySelectorAll('#pager button').forEach(b => b.onclick = () => {
      page = +b.dataset.p; draw();
    });
    document.getElementById('wkCard').innerHTML = card(WEEKS[sel]);
  }
  draw();
})();
</script>
<script>
(function () {
  // 수집이 실패하면 페이지가 다시 만들어지지 않는다.
  // 그래서 "마지막 갱신이 언제였는지"만 보면 실패를 알아챌 수 있다.
  var el = document.getElementById('stale');
  if (!el) return;
  var iso = el.dataset.generated;
  if (!iso) return;
  var t = new Date(iso);
  if (isNaN(t)) return;
  var hours = (Date.now() - t.getTime()) / 3600000;
  if (hours < 36) return;
  var days = Math.floor(hours / 24);
  var when = days >= 1 ? (days + '일') : (Math.floor(hours) + '시간');
  el.innerHTML = '⚠️ <b>' + when + '째 데이터가 갱신되지 않았습니다.</b> ' +
    '매일 아침 7시에 자동 수집되어야 하는데 실패한 것으로 보입니다. ' +
    '<a href="https://github.com/wevape-no01/ig-report/actions" target="_blank" rel="noopener">' +
    '실행 기록 확인</a> · 아래 숫자는 마지막으로 성공한 시점의 값입니다.';
  el.className = 'stale on';
})();
</script>
<script>
(function () {
  var KEY = 'wevape-sns-read';
  var bell = document.getElementById('bell');
  if (!bell) return;
  var panel = document.getElementById('panel');
  var body  = document.getElementById('panelBody');
  var count = document.getElementById('bellCount');
  var stack = document.getElementById('toasts');
  var items = [];

  function readIds() {
    try { return JSON.parse(localStorage.getItem(KEY) || '[]') || []; }
    catch (e) { return []; }
  }
  function saveIds(a) {
    try { localStorage.setItem(KEY, JSON.stringify(a.slice(-80))); } catch (e) {}
  }
  function isRead(id) { return readIds().indexOf(id) !== -1; }
  function markRead(id) {
    var a = readIds();
    if (a.indexOf(id) === -1) { a.push(id); saveIds(a); }
    paint();
  }
  function esc(t) {
    return (t || '').replace(/[<>&"]/g, function (c) {
      return ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'})[c]; });
  }

  function paint() {
    var unread = items.filter(function (n) { return !isRead(n.id); });
    count.textContent = unread.length > 9 ? '9+' : String(unread.length);
    bell.classList.toggle('unread', unread.length > 0);
    if (!items.length) {
      body.innerHTML = '<div class="nt-empty">알림이 없습니다.</div>';
      return;
    }
    body.innerHTML = items.map(function (n) {
      var read = isRead(n.id);
      return '<div class="nt ' + esc(n.level) + (read ? ' read' : '') +
        '" data-id="' + esc(n.id) + '"><span class="dot"></span><div class="tx">' +
        '<div class="t">' + esc(n.title) + '</div>' +
        (n.body ? '<div class="b">' + esc(n.body) + '</div>' : '') +
        '<div class="w">' + esc(n.at) + (read ? '' : ' · 읽지 않음') + '</div>' +
        '</div></div>';
    }).join('');
    body.querySelectorAll('.nt').forEach(function (el) {
      el.onclick = function () {
        var n = items.filter(function (x) { return x.id === el.dataset.id; })[0];
        markRead(el.dataset.id);
        if (n && n.link) window.open(n.link, '_blank', 'noopener');
      };
    });
  }

  // 버튼을 누르지 않아도 안 읽은 알림은 팝업으로 바로 뜬다 (최대 3개)
  function popup() {
    if (!stack) return;
    items.filter(function (n) { return !isRead(n.id); }).slice(0, 3).forEach(function (n) {
      var d = document.createElement('div');
      d.className = 'toast ' + n.level;
      d.innerHTML = '<button class="toast-close" aria-label="닫기">&times;</button>' +
        '<div class="t">' + esc(n.title) + '</div>' +
        (n.body ? '<div class="b">' + esc(n.body) + '</div>' : '') +
        '<div class="r"><button class="ok on">읽음</button>' +
        (n.link ? '<a href="' + esc(n.link) + '">열어보기</a>' : '') + '</div>';
      // X 는 이번만 숨기기 — 안 읽은 상태는 그대로 남는다
      d.querySelector('.toast-close').onclick = function () { d.remove(); };
      d.querySelector('.ok').onclick = function () { markRead(n.id); d.remove(); };
      stack.appendChild(d);
    });
  }

  bell.onclick = function (e) {
    e.stopPropagation();
    var on = panel.classList.toggle('on');
    bell.setAttribute('aria-expanded', on ? 'true' : 'false');
    // 팝업과 목록이 같은 자리에 겹친다. 목록을 열면 팝업은 치운다.
    // (읽음 처리는 하지 않으므로 안 읽은 표시는 그대로 남는다)
    if (on && stack) stack.innerHTML = '';
  };
  document.addEventListener('click', function (e) {
    if (!panel.contains(e.target)) panel.classList.remove('on');
  });
  document.getElementById('markAll').onclick = function (e) {
    e.stopPropagation();
    saveIds(items.map(function (n) { return n.id; }));
    if (stack) stack.innerHTML = '';
    paint();
  };

  // 캐시를 피하려고 시각을 붙인다 (GitHub Pages 는 파일을 오래 물고 있다)
  fetch('./notices.json?t=' + Date.now(), {cache: 'no-store'})
    .then(function (r) { return r.ok ? r.json() : []; })
    .then(function (d) {
      items = Array.isArray(d) ? d : [];
      paint();
      popup();
    })
    .catch(function () { paint(); });
})();
</script>
</body></html>
