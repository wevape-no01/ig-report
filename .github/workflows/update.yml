name: 인스타 리포트 갱신

on:
  schedule:
    # 매일 한국시간 오전 7시 (UTC 22:00). GitHub 사정으로 몇십 분 늦을 수 있음.
    - cron: "0 22 * * *"
  workflow_dispatch:        # Actions 탭에서 손으로도 실행 가능

permissions:
  contents: write           # 갱신된 html / json 을 저장소에 다시 커밋
  issues: write             # 매주 월요일 주간 리포트를 이슈로 발행

concurrency:
  group: ig-report
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # 시크릿은 step 의 if 에서 직접 못 읽는다. 그래서 env 로 한 번 옮겨둔다.
    env:
      HAS_THREADS: ${{ secrets.THREADS_TOKEN != '' }}
      HAS_ALERT: ${{ secrets.ALERT_WEBHOOK != '' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 만료되는 토큰(스레드)을 시크릿에 되돌려 쓸 때 필요하다.
      - name: 준비물 설치
        run: pip install pynacl

      - name: 인스타 데이터 수집
        env:
          IG_ACCOUNTS: ${{ secrets.IG_ACCOUNTS }}
        run: python instagram_api.py

      # 스레드는 THREADS_TOKEN 이 설정된 뒤에만 동작한다.
      - name: 스레드 데이터 수집
        id: threads
        if: env.HAS_THREADS == 'true'
        continue-on-error: true      # 스레드가 실패해도 인스타 리포트는 나가게 한다
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python threads_api.py

      # 스레드만 실패한 경우. 아래 커밋 단계가 notices.json 을 같이 올린다.
      - name: 스레드 실패 알림 기록
        if: steps.threads.outcome == 'failure'
        continue-on-error: true
        run: |
          python notice.py warn "threads-$(date -u +%Y-%m-%d)" \
            "스레드 수집만 실패했습니다" \
            "인스타그램 리포트는 정상 갱신됐습니다. 스레드 숫자는 마지막으로 성공한 시점의 값입니다." \
            "$RUN_URL"

      # 콘텐츠 분석 수치를 주 단위로 적어 둔다 (analysis_history.json).
      # 같은 주에 여러 번 돌아도 한 줄만 남는다. API 호출 없음.
      - name: 콘텐츠 분석 스냅샷 기록
        run: python analysis_history.py

      - name: 인스타그램 페이지 생성
        run: |
          python build_dashboard.py
          python build_analysis.py
          python build_analysis_trend.py

      - name: 스레드 페이지 생성
        run: |
          python build_threads.py
          python build_threads_analysis.py

      # 저장된 json 만 읽어 만든다. API 호출 없음.
      - name: 주간 리포트 페이지 생성
        run: python build_weekly.py

      # 매주 월요일(UTC 일요일 22시 실행분)에만 이슈를 하나 만들고 사이트 알림도 남긴다.
      # GitHub 모바일 앱에서 이 저장소를 Watch 하면 휴대폰 알림이 온다.
      - name: 주간 리포트 발행
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 실행 시각은 UTC 일요일 22시 = 한국시간 월요일 오전 7시
          if [ "$(date -u +%u)" = "7" ]; then
            python weekly_issue.py
          else
            echo "월요일(한국시간)이 아니라 주간 리포트는 건너뜁니다."
          fi

      # 콘텐츠 분석 진단도 같은 요일에 사이트 알림 + 이슈(휴대폰)로 내보낸다.
      # 확인 필요 항목이나 지난주 대비 하락이 있으면 제목에 ⚠️ 가 붙고 알림 등급이 올라간다.
      - name: 콘텐츠 분석 보고 발행
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(date -u +%u)" = "7" ]; then
            python analysis_issue.py
          else
            echo "월요일(한국시간)이 아니라 콘텐츠 분석 보고는 건너뜁니다."
          fi

      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 만들어지는 페이지는 빠짐없이 올린다. 여기서 빠지면 그 페이지만
          # 옛날 것으로 남아 다른 페이지와 숫자가 어긋난다 (실제로 세부 분석·
          # 지난 리포트가 그렇게 방치돼 있었다).
          git add index.html analysis.html analysis-detail.html analysis-trend.html \
                  threads.html threads-analysis.html threads-detail.html \
                  weekly.html weekly-past.html \
                  threads-weekly.html threads-weekly-past.html \
                  history.json report_data.json posts_cache.json
          for f in notices.json threads_history.json threads_report.json \
                   threads_cache.json threads_token_meta.json analysis_history.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --staged --quiet; then
            echo "변경사항 없음 — 커밋 생략"
          else
            git commit -m "리포트 자동 갱신 $(date -u +'%Y-%m-%d')"
            git push
          fi

      # 실패했다가 정상으로 돌아오면 열려 있던 실패 이슈를 닫는다.
      - name: 복구 확인
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python fail_issue.py close

      # ---------------- 실패했을 때 ----------------
      # 수집이 실패하면 위 커밋 단계까지 못 온다. 그래서 알림만 따로 올린다.
      # GitHub 이 자동으로 보내는 실패 푸시는 저장소·워크플로 이름만 실어 보내서
      # 무엇이 실패했는지 안 보인다. 그래서 이슈로도 남긴다 (이슈 푸시는 내용이 실린다).
      - name: 실패 알림 기록
        if: failure()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python fail_issue.py open
          python notice.py error "collect-$(date -u +%Y-%m-%d)" \
            "데이터 수집이 실패했습니다" \
            "자동 갱신이 실패해 리포트 숫자가 어제 그대로입니다. 원인은 실행 기록에서 볼 수 있습니다." \
            "$RUN_URL"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notices.json
          if git diff --staged --quiet; then
            echo "알림 변경 없음"
          else
            git commit -m "알림: 데이터 수집 실패 $(date -u +'%Y-%m-%d')"
            git push
          fi

      # 휴대폰 푸시는 GitHub 모바일 앱이 담당한다.
      # 아래는 슬랙/디스코드를 추가로 쓸 때만 켜진다 (ALERT_WEBHOOK 시크릿).
      - name: 실패 웹훅 알림
        if: failure() && env.HAS_ALERT == 'true'
        continue-on-error: true
        env:
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
        run: python alert.py "🔴 WEVAPE SNS — 데이터 수집이 실패했습니다. 리포트가 갱신되지 않았습니다."

      - name: 스레드만 실패 웹훅 알림
        if: steps.threads.outcome == 'failure' && env.HAS_ALERT == 'true'
        continue-on-error: true
        env:
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
        run: python alert.py "🟠 WEVAPE SNS — 스레드 수집만 실패했습니다. 인스타그램 리포트는 정상 갱신됐습니다."
