name: 인스타 리포트 갱신

on:
  schedule:
    # 매일 한국시간 오전 7시 (UTC 22:00). GitHub 사정으로 몇십 분 늦을 수 있음.
    - cron: "0 22 * * *"
  workflow_dispatch:        # Actions 탭에서 손으로도 실행 가능

permissions:
  contents: write           # 갱신된 html / json 을 저장소에 다시 커밋

concurrency:
  group: ig-report
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # 시크릿은 step 의 if 에서 직접 못 읽는다. 그래서 env 로 한 번 옮겨둔다.
    env:
      HAS_THREADS: ${{ secrets.THREADS_TOKEN != '' }}
      HAS_ALERT: ${{ secrets.ALERT_WEBHOOK != '' || secrets.KAKAO_REFRESH_TOKEN != '' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 만료되는 토큰(스레드·카카오)을 시크릿에 되돌려 쓸 때 필요하다.
      - name: 준비물 설치
        run: pip install pynacl

      - name: 인스타 데이터 수집
        env:
          IG_ACCOUNTS: ${{ secrets.IG_ACCOUNTS }}
        run: python instagram_api.py

      # 스레드는 THREADS_TOKEN 이 설정된 뒤에만 동작한다.
      - name: 스레드 데이터 수집
        id: threads
        if: env.HAS_THREADS == 'true'
        continue-on-error: true      # 스레드가 실패해도 인스타 리포트는 나가게 한다
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python threads_api.py

      - name: 인스타그램 페이지 생성
        run: |
          python build_dashboard.py
          python build_analysis.py

      - name: 스레드 페이지 생성
        run: |
          python build_threads.py
          python build_threads_analysis.py

      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html analysis.html threads.html threads-analysis.html \
                  history.json report_data.json posts_cache.json
          for f in threads_history.json threads_report.json \
                   threads_cache.json threads_token_meta.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --staged --quiet; then
            echo "변경사항 없음 — 커밋 생략"
          else
            git commit -m "리포트 자동 갱신 $(date -u +'%Y-%m-%d')"
            git push
          fi

      # ---------------- 실패 알림 ----------------
      # 카카오톡(KAKAO_REFRESH_TOKEN) 또는 웹훅(ALERT_WEBHOOK)이 설정되면 켜진다.
      - name: 실패 알림
        if: failure() && env.HAS_ALERT == 'true'
        continue-on-error: true
        env:
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python alert.py "🔴 WEVAPE SNS — 데이터 수집이 실패했습니다. 리포트가 갱신되지 않았습니다."

      # 스레드만 실패한 경우(전체 job 은 성공) 따로 알린다.
      - name: 스레드만 실패 알림
        if: steps.threads.outcome == 'failure' && env.HAS_ALERT == 'true'
        continue-on-error: true
        env:
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python alert.py "🟠 WEVAPE SNS — 스레드 수집만 실패했습니다. 인스타그램 리포트는 정상 갱신됐습니다."
