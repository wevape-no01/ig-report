name: 카카오톡 알림 연결 (최초 1회)

# 카카오 인가 코드를 리프레시 토큰으로 바꿔 시크릿(KAKAO_REFRESH_TOKEN)에 저장한다.
# 인가 코드는 10분 안에 만료되는 일회용 값이라, 여기 입력해도 재사용될 수 없다.
# 리프레시 토큰은 화면에 절대 출력하지 않는다.
#
# 미리 준비할 것:
#   시크릿 KAKAO_REST_KEY  — 카카오 개발자 앱의 REST API 키
#   시크릿 GH_PAT          — 이미 등록되어 있음 (시크릿 쓰기 권한)

on:
  workflow_dispatch:
    inputs:
      code:
        description: "카카오 인가 코드 (주소창의 ?code= 뒤 값)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pynacl

      - name: 인가 코드를 토큰으로 교환하고 저장
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_REDIRECT_URI: https://wevape-no01.github.io/ig-report/
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python kakao.py setup "${{ inputs.code }}"
